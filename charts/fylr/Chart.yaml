apiVersion: v2
name: fylr
description: Deploy fylr to your Kubernetes cluster

type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)

version: 1.1.236

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "v6.34.7"

maintainers:
  - name: programmfabrik
    email: support@programmfabrik.de
    url: https://programmfabrik.de

dependencies:
  # Beware: use helm dependency update (in charts/fylr) to download them to charts/fylr/charts

  # https://github.com/minio/minio/tree/master/helm/minio
  # 5.4.0 rather than 4.0.14 because 4.0.14's post-install hooks speak a
  # dialect of mc that no obtainable client still understands: it calls
  # `mc policy set`, `mc admin policy add` and `mc admin policy set`, all three
  # of which were renamed years ago, and it pipes a credentials file through
  # sed. 5.4.0 uses `mc anonymous set`, `mc admin policy create` and
  # `mc admin policy attach`, and needs no sed. Every minio value this chart
  # sets exists unchanged in 5.4.0, and the resource names it generates are
  # identical, so nothing downstream moves.
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
  # https://github.com/bitnami/charts/tree/master/bitnami/postgresql-ha
  - name: postgresql-ha
    version: 12.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql-ha.enabled
  # https://github.com/bitnami/charts/tree/master/bitnami/elasticsearch
  - name: elasticsearch
    version: 19.21.2
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
  # https://github.com/bitnami/charts/tree/main/bitnami/opensearch
  - name: opensearch
    version: 1.2.6
    repository: https://charts.bitnami.com/bitnami
    condition: opensearch.enabled
  # https://programmfabrik.github.io/fylr-helm/charts/execserver/
  - name: execserver
    version: 0.1.107
    repository: https://programmfabrik.github.io/fylr-helm
    condition: execserver.enabled
  # https://github.com/bitnami/charts/tree/master/bitnami/postgresql
  - name: postgresql
    version: 12.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
