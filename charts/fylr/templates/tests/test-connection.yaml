apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fylr.fullname" . }}-test-connection"
  labels:
    {{- include "fylr.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # The backend, not the webapp: the webapp answers any request whose Host
      # is not fylr.externalURL with a redirect to it, and that host does not
      # resolve inside the cluster. /healthz is what the probes use.
      args:
        - '-q'
        - '-O'
        - '/dev/null'
        - 'http://{{ include "fylr.service-backend-name" . }}:{{ .Values.services.backend.port }}/healthz'
  restartPolicy: Never
