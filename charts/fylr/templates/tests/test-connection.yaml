apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fylr.fullname" . }}-test-connection"
  labels:
    {{- include "fylr.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # the webapp Service, not the release: this chart names no Service after
      # the release itself, so the bare fullname never resolved
      args:
        - '-q'
        - '-O'
        - '/dev/null'
        - 'http://{{ include "fylr.service-webapp-name" . }}:{{ .Values.services.webapp.port }}/'
  restartPolicy: Never
