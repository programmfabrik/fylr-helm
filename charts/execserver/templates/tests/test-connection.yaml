apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "execserver.fullname" . }}-test-connection"
  labels:
    {{- include "execserver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-available-services
      image: alpine:latest
      # ONE argument: `sh -c` runs its first operand and binds the rest to $0,
      # $1, ... — as a list this ran "apk update" and dropped the script
      command: [ '/bin/sh', '-c' ]
      env:
        - name: SERVICE_ADDRESS
          value: "{{ include "execserver.fullname" . }}:{{ .Values.service.port }}"
        - name: VALIDATION_SERVICES
          value: "{{ .Values.tests.validationServices }}"
      args:
        - 'apk add --no-cache bash && bash /tmp/test-connection-config/entrypoint.sh'
      volumeMounts:
        - name: test-connection-config
          mountPath: /tmp/test-connection-config
          readOnly: false
  volumes:
    - name: test-connection-config
      configMap:
        name: "{{ include "execserver.fullname" . }}-test-connection"
  restartPolicy: Never
