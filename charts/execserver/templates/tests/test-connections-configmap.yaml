kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ include "execserver.fullname" . }}-test-connection"
  labels:
    {{- include "execserver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
data:
    entrypoint.sh: |-
      #!/bin/bash
      set -e
      set -x
      apk add --no-cache curl jq
      if [ -z "$SERVICE_ADDRESS" ]; then
          echo "SERVICE_ADDRESS is not set"
          exit 1
      fi
      if [ -z "$VALIDATION_SERVICES" ]; then
          echo "VALIDATION_SERVICES is not set"
          exit 1
      fi
      VALIDATION_SERVICES=$(sed -e "s/,/ /g" <<< "$VALIDATION_SERVICES")
      echo $VALIDATION_SERVICES
      BASE="http://$SERVICE_ADDRESS"
      code=0

      # From fylr 6.35 the broker rewrite dropped /job/<service> and added
      # /broker/status, which reports every service the execserver configured.
      # Ask that first; an older execserver answers 404 and is asked service by
      # service below.
      wantbook=$(curl -s -o /tmp/wantbook -w '%{http_code}' "$BASE/broker/status")
      if [ "$wantbook" == "200" ]; then
          offered=$(jq -r '.service_stats // {} | keys | join(" ")' /tmp/wantbook)
          echo "The execserver offers: $offered"
          for SERVICE in $VALIDATION_SERVICES; do
              if grep -qw -- "$SERVICE" <<< "$offered"; then
                  echo "Check for service [ $SERVICE ] passed"
              else
                  echo "Error: the execserver does not offer [ $SERVICE ]"
                  code=1
              fi
          done
          exit $code
      fi

      for SERVICE in $VALIDATION_SERVICES; do
          echo "Validating service: $SERVICE"
          # The status code decides, not the body. A service the execserver
          # does not have answers 404 with the plain text `Unknown service
          # "name"`, which is not JSON - reading it with jq yields nothing, and
          # a comparison against that nothing passes whatever it is compared
          # to. A service it does have refuses this job for having no id, with
          # 500 and a JSON body. Anything but 404 therefore means the service
          # is there and answered.
          statusCode=$(curl -s -o /tmp/body -w '%{http_code}' -X GET "$BASE/job/$SERVICE")
          if [ "$statusCode" == "404" ]; then
              echo "Status code is: $statusCode"
              echo "Error: $(cat /tmp/body)"
              code=1
          else
              echo "Check for service [ $SERVICE ] passed"
          fi
      done
      exit $code
